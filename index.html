<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Registration Form</h1>
    <form action="">
        <label for="name">Full Name</label>
        <input type="text" name="" id="name" placeholder="Enter your full name" required>


        <label for="email">Email</label>
        <input type="email" name="" id="email" placeholder="Enter your email" required>


        <label for="password">Password</label>
        <input type="password" name="" id="password" placeholder="Enter your password" required>


        <label for="confirm_password">Confirm Password</label>
        <input type="password" name="" id="confirm_password" placeholder="Re-enter your password" required>


        <label>Gender</label>
        <div class="gender">
            <label><input type="radio" name="gender" id="" value="male">Male</label>
            <label><input type="radio" name="gender" id="" value="female">Female</label>
        </div>

        <label for="dob">Date Of Birth</label>
        <input type="date" name="" id="dob" required>


        <label for="">Country</label>
        <select name="" id="">
            <option value="Pakistan">Pakistan</option>
            <option value="China">China</option>
            <option value="Iran">Iran</option>
            <option value="Afghanistan">Afghanistan</option>
        </select>


        <label for="phone_number">Phone Number</label>
        <input type="text" name="" id="phone_number" placeholder="Optional">


        <label for="address">Address</label>
        <input type="text" name="" id="address" placeholder="Optional">


        <label><input type="checkbox" name="" id="" value="Agreed" checked>I agreed to the terms and conditions.</label>


        <button type="submit">Register</button>
    </form>
</body>

</html>
